<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MARI</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centred 760px column — start → inputs → calculating → result. Single light theme by design. */
:root{ color-scheme:light;
  --bg:#F8FAFC; --surface:#FFFFFF; --ink:#22303E; --muted:#66727F; --line:#E3E8EE; --line2:#EEF2F6;
  --accent:#3E63B8; --accent-2:#5C7FCC; --accent-soft:#EBF1FC; --gene:#4F74C9; --req:#B4532A;
  --rtl:50%; --rbl:70%; --tick:#22303E;
  --f-ui:"Instrument Sans", "Noto Sans KR", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* header */
header{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:12.5px;border:0;padding:5px 11px;background:transparent;color:var(--muted);cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.hfull{margin:0;font-size:clamp(20px,2.8vw,27px);font-weight:500;line-height:1.25;text-wrap:balance}
.hfull .ttl b,.sttitle b{font-weight:800;color:var(--accent)}
.hfull .info{vertical-align:3px;margin-left:6px}
.wrap[data-view="start"] .hfull,.wrap[data-view="start"] .foot,.wrap[data-view="calc"] .foot{display:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:15px;margin:0;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* input rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}
.row:first-child{border-top:0}
.row .lab{min-width:0}
.row .name{font-weight:600}
.row .name i{font-style:italic}
.row .meta{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.row .info{margin-left:6px;vertical-align:1px}
.req{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--req);border:1px solid color-mix(in srgb,var(--req) 35%,transparent);border-radius:999px;padding:0 7px;vertical-align:2px}
.row.missing .name{color:var(--req)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;padding:6px 12px;background:var(--surface);color:var(--muted);cursor:pointer;min-width:52px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.inp{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
input.inp{width:5.5em;font-family:var(--f-data);text-align:right}
.numw{display:inline-flex;align-items:center;gap:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip.ex{border-style:dashed;color:var(--accent)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.progress{font-size:13px;color:var(--muted)}
.primary{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:12px 22px;background:var(--accent);color:#fff;cursor:pointer;min-width:12em}
.primary:hover{filter:brightness(1.08)}
.primary[aria-disabled="true"]{background:#B9C4D6;cursor:not-allowed;filter:none}
.seg button:focus-visible,.chip:focus-visible,.lang button:focus-visible,.inp:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* info tooltips */
.info{position:relative;display:inline-flex}
.ib{font:700 11px/1 var(--f-ui);width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);cursor:help;padding:0;display:inline-grid;place-items:center}
.ib-lg{width:22px;height:22px;font-size:12.5px}
.tt{display:none;position:absolute;left:-6px;top:calc(100% + 8px);z-index:20;width:min(320px,78vw);background:var(--ink);color:#fff;font-size:12.5px;font-weight:400;line-height:1.45;padding:9px 11px;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,45,.18);text-align:left}
.tt-wide{width:min(440px,86vw)}
.tt::before{content:"";position:absolute;left:11px;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.info:hover .tt,.ib:focus + .tt{display:block}

/* start */
.start{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:36px;min-height:min(62vh,560px);padding-block:24px}
.sttitle{margin:0;font-size:clamp(22px,3.6vw,34px);line-height:1.18;font-weight:500;letter-spacing:-.01em;white-space:nowrap;text-wrap:nowrap;color:var(--ink)}
.primary.big{font-size:20px;padding:18px 56px;border-radius:14px;min-width:min(280px,80vw);box-shadow:0 6px 18px rgba(62,99,184,.22)}

/* calculating */
.calc{align-items:center;text-align:center;padding-block:40px 36px;gap:10px;position:relative}
.ring{width:132px;height:132px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line2);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73}
.pct{position:absolute;top:84px;left:0;right:0;font-family:var(--f-data);font-size:26px;font-variant-numeric:tabular-nums}
.ctitle{font-weight:700;font-size:16px;margin-top:6px}
.cstep{color:var(--muted);font-size:13.5px;min-height:1.5em}
.cbarline{width:min(320px,80%);height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.cbarline span{display:block;height:100%;width:0;background:var(--accent)}

/* result */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.back::before{content:"← "}
.exflag{font-size:12px;font-weight:600;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:2px 10px}
#h-out{font-size:18px}
#h-out:focus{outline:none}
.result{--rh:80;--rc:.03;--a:.1}
.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;
  background:oklch(var(--rbl) var(--rc) var(--rh) / var(--a));border:1px solid oklch(var(--rbl) var(--rc) var(--rh) / calc(var(--a) + .18));transition:background .25s ease,border-color .25s ease}
.verdict .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:oklch(var(--rtl) var(--rc) var(--rh))}
.verdict .margin{font-size:13px;color:var(--muted)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .num{color:oklch(var(--rtl) var(--rc) var(--rh));font-family:var(--f-data);font-size:44px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score .unit{color:var(--muted);font-size:13px}
.gauge{position:relative;height:38px;margin-top:4px}
.gauge .track{position:absolute;left:0;right:0;top:13px;height:8px;border-radius:4px;
  background:linear-gradient(90deg in oklch,oklch(var(--rbl) .09 200 / .55),oklch(var(--rbl) .03 80 / .45) 50%,oklch(var(--rbl) .14 15 / .7))}
.gauge .cut{position:absolute;left:50%;top:7px;width:1.5px;height:20px;background:var(--tick);opacity:.5}
.gauge .dot{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:oklch(var(--rtl) var(--rc) var(--rh));border:3px solid var(--surface);box-shadow:0 0 0 1px oklch(var(--rtl) var(--rc) var(--rh)),0 1px 3px rgba(0,0,0,.18);transition:left .25s ease,background .25s ease}
.gauge .ticks{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:space-between;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--f-data);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.stack{position:relative;display:flex;height:36px;border-radius:8px;background:var(--line2);margin-top:26px}
.stack .seg7{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:inset -2px 0 0 var(--surface)}
.stack .seg7:first-child{border-radius:8px 0 0 8px}
.stack .seg7:last-of-type{border-radius:0 8px 8px 0}
.stack .seg7.off{background:repeating-linear-gradient(135deg,var(--line2) 0 6px,var(--surface) 6px 10px)!important;color:#6F7C89;font-weight:600}
.stack .avg{position:absolute;top:-22px;bottom:-6px;width:0;border-left:2px dashed var(--ink);opacity:.7}
.stack .avg span{position:absolute;top:-1px;left:5px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.stackax{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend .k1{background:var(--accent)}
.legend .k2{background:repeating-linear-gradient(135deg,var(--line2) 0 4px,var(--surface) 4px 7px);border:1px solid var(--line)}
.vlist{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vlist li{border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--surface)}
.vlist li.on{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.vlist .vh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vlist .g{font-weight:700;font-style:italic;font-size:16px}
.vlist .st{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.vlist li.on .st{background:var(--accent);border-color:var(--accent);color:#fff}
.vlist .wrow{display:flex;align-items:center;gap:8px}
.vlist .wbar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.vlist .wbar span{display:block;height:100%;background:#B7C2CE}
.vlist li.on .wbar span{background:var(--accent)}
.vlist .wl{font-size:12px;color:var(--muted);white-space:nowrap}
.vlist .rs{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.mono{font-family:var(--f-data)}

/* footer */
.foot{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.foot p{margin:0}
.foot b{color:var(--ink)}

@media (prefers-reduced-motion:reduce){.gauge .dot,.verdict{transition:none}}

/* phones */
@media (max-width:640px){
  body{font-size:14.5px}
  .panel{padding:14px 14px 16px}
  .row{gap:8px}
  .seg button{padding:7px 10px;min-width:0}
  .ib{width:22px;height:22px;font-size:12px}
  .tt,.tt-wide{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
    top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;font-size:13.5px;padding:12px 14px;z-index:50}
  .tt::before{display:none}
  .sttitle{white-space:normal;text-wrap:balance;max-width:20ch;font-size:26px}
  .score .num{font-size:38px}
  .stack .seg7{font-size:10.5px}
  .vlist{grid-template-columns:1fr 1fr;gap:8px}
  .vlist li{padding:9px 10px}
  .vlist .vh{flex-direction:column;align-items:flex-start;gap:5px}
  .vlist .g{font-size:14.5px}
  .vlist .st{font-size:11px;padding:2px 7px}
  .vlist .wl{font-size:11px}
  .actions{flex-direction:column-reverse;align-items:stretch}
  .primary{width:100%}
  .progress{text-align:center}
  /* projection table becomes one card per setting */
  .ptable thead{display:none}
  .ptable tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
  .ptable td{border:0;padding:0;text-align:left;font-size:12.5px}
  .ptable td:first-child{grid-column:1 / -1;font-weight:700;font-size:13.5px;margin-bottom:2px}
  .ptable td[data-l]::before{content:attr(data-l) "  ";color:var(--muted);font-family:var(--f-ui);font-size:11.5px}
}
@media (max-width:360px){ .vlist{grid-template-columns:1fr} }
</style>
</head>
<body>


<div class="wrap" data-view="start">
  <header>
    <div class="top">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <div class="lang" role="group" id="lang-group" data-i18n-aria="aLang"><button id="l-en" type="button" data-l="en">EN</button><button id="l-ko" type="button" data-l="ko">한국어</button></div>
    </div>
    <h1 class="hfull"><span class="ttl" data-i18n-html="full"></span><span class="info"><button type="button" class="ib ib-lg" id="about-tip" aria-describedby="about-tt" data-i18n-aria="aAbout">i</button><span class="tt tt-wide" role="tooltip" id="about-tt"><span data-i18n="about1"></span> <span data-i18n="about2"></span></span></span></h1>
  </header>

  <main class="grid">
    <section class="start" id="panel-start" aria-labelledby="h-start">
      <h2 id="h-start" class="sttitle" data-i18n-html="full"></h2>
      <button class="primary big" id="start" type="button" data-i18n="stB"></button>
    </section>

    <section class="panel" id="panel-in" aria-labelledby="h-in" hidden>
      <h2 id="h-in"><span data-i18n="gp"></span> <small data-i18n="gps"></small></h2>
      <div class="tools">
        <button class="chip" id="all-car" type="button" data-i18n="allc"></button>
        <button class="chip" id="all-non" type="button" data-i18n="alln"></button>
        <button class="chip ex" id="example" type="button" data-i18n="exB"></button>
      </div>
      <div class="rows" id="genes"></div>

      <h2><span data-i18n="ci"></span></h2>
      <p class="note" data-i18n="cz"></p>
      <div class="rows" id="clin"></div>
      <div class="actions">
        <span class="progress" id="progress" aria-live="polite"></span>
        <button class="primary" id="go" type="button" data-i18n="go"></button>
      </div>
    </section>

    <section class="panel calc" id="panel-calc" aria-live="polite" hidden>
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
        <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"></circle>
      </svg>
      <div class="pct" id="pct">0%</div>
      <div class="ctitle" data-i18n="calcT"></div>
      <div class="cstep" id="cstep"></div>
      <div class="cbarline"><span id="cfill"></span></div>
    </section>

    <section class="panel result" id="panel-out" aria-labelledby="h-out" hidden>
      <div class="rhead"><button class="chip back" id="back" type="button" data-i18n="back"></button><span class="exflag" id="exflag" data-i18n="exF" hidden></span></div>
      <h2 id="h-out" tabindex="-1"><span data-i18n="res"></span></h2>
      <div class="verdict" id="verdict">
        <span class="tag" id="vtag"></span>
        <div class="score"><span class="num" id="pnum"></span><span class="unit" data-i18n="unit"></span></div>
        <span class="margin" id="pmargin"></span>
      </div>
      <div class="gauge" aria-hidden="true">
        <div class="track"></div><div class="cut"></div><div class="dot" id="dot"></div>
        <div class="ticks"><span>0</span><span data-i18n="tick"></span><span>1</span></div>
      </div>
      <div class="kv">
        <div><span data-i18n="kc"></span><b id="kcount"></b></div>
        <div><span data-i18n="kp"></span><b id="kprs"></b></div>
        <div><span data-i18n="kz"></span><b id="kz"></b></div>
      </div>

      <h2><span data-i18n="gpT"></span> <small id="gpsum"></small></h2>
      <div class="stack" id="stack" aria-hidden="true"><div class="avg" id="avg"><span data-i18n="avgL"></span></div></div>
      <div class="stackax"><span>0</span><span data-i18n="maxL"></span></div>
      <div class="legend"><span><i class="k1"></i><span data-i18n="lg1"></span></span><span><i class="k2"></i><span data-i18n="lg2"></span></span></div>
      <ul class="vlist" id="vlist"></ul>
      <p class="note" data-i18n="cnote"></p>

      <h2><span data-i18n="pp"></span> <small data-i18n="pps"></small></h2>
      <div class="settings">
        <table class="ptable">
          <thead><tr><th data-i18n="th1"></th><th data-i18n="th2"></th><th data-i18n="th3"></th><th>NPV</th><th>PPV</th></tr></thead>
          <tbody id="ptab"></tbody>
        </table>
        <p class="note" id="sesp"></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n-html="f1"></p>
    <p data-i18n-html="f2"></p>
  </footer>
</div>

<script>
/* ---------- text (EN / KO) ---------- */
const FULL = "<b>M</b>RONJ <b>A</b>ssessment of <b>R</b>isk with <b>I</b>nherited variants";
const T = {
 en:{eyebrow:"Beta version v0.9", full:FULL, aLang:"Language", aAbout:"About this calculator", aInfo:"definition",
  about1:"Enter carrier status for the seven panel variants and the clinical items, then select View result. The calculator applies the model developed in the study, with a fixed cutoff of 0.50.",
  about2:"The score shows whether a patient falls above or below the 0.50 cutoff. It is not the probability of developing MRONJ.",
  stB:"Start",
  gp:"Germline panel", gps:"carrier = at least one copy of the variant",
  allc:"Mark all carrier", alln:"Mark all non-carrier", exB:"Load example patient",
  car:"Carrier", non:"Non-carrier", yes:"Yes", no:"No", req:"Required", select:"Select…", months:"months",
  ci:"Clinical items",
  cz:"Only bisphosphonate therapy, oral bisphosphonate and history of tooth extraction change the score, so these three are required. The other eight items did not contribute to the final model and are optional. Hover over or tap the i icons for definitions.",
  c_bp:"Bisphosphonate therapy", c_po:"Oral bisphosphonate", c_ext:"History of tooth extraction",
  c_bmi:"BMI category", c_htn:"Hypertension", c_ra:"Rheumatoid arthritis", c_ste:"Systemic glucocorticoid use",
  c_deno:"Denosumab therapy", c_bd:"Both bisphosphonate and denosumab", c_mm:"Total antiresorptive treatment duration", c_imp:"Dental implant placement",
  tips:{bmi:"Body mass index (kg/m²), Korean Society for the Study of Obesity criteria: underweight <18.5; normal weight 18.5–22.9; overweight 23.0–24.9; mild obesity 25.0–29.9; moderate obesity ≥30.0.",

let LANG = "en";
try { const v = localStorage.getItem("mronj-lang"); if (v==="ko"||v==="en") LANG=v; } catch(e){}
const t = k => T[LANG][k];

/* ---------- model (Supplementary Table S4, integrated model) ---------- */
const MU = 5.83164755271135, SD = 2.202154830477;
const GENES = [
  {id:"g-mylk",  gene:"MYLK",    rs:"rs3732487",  w:1.75770098899728},
  {id:"g-zks",   gene:"ZKSCAN2", rs:"rs2112811",  w:2.22100811766702},
  {id:"g-crnn",  gene:"CRNN",    rs:"rs3829868",  w:0.585890364053},
  {id:"g-c6",    gene:"C6",      rs:"rs1801033",  w:1.02934247517629},
  {id:"g-rpap1", gene:"RPAP1",   rs:"rs1200345",  w:1.71835556930564},
  {id:"g-mmrn1", gene:"MMRN1",   rs:"rs12646270", w:1.28527224798385},
  {id:"g-cfap",  gene:"CFAP77",  rs:"rs7047726",  w:1.27276403890651}
];
const MODEL = {b0:2.009, prs:0.947751371668514, bp:-0.654, po:-0.063, ext:-1.355};
const PERF  = {se:14/16, sp:4/5};            // internal test set at 0.50 (manuscript)
const CLIN = [   // req = changes the score; others have coefficient 0 in the final model
  {id:"c-bmi",  key:"bmi",  type:"bmi"},
  {id:"c-htn",  key:"htn",  type:"bin"},
  {id:"c-ra",   key:"ra",   type:"bin"},
  {id:"c-ste",  key:"ste",  type:"bin"},
  {id:"c-bp",   key:"bp",   type:"bin", req:1},
  {id:"c-deno", key:"deno", type:"bin"},
  {id:"c-bd",   key:"bd",   type:"bin"},
  {id:"c-po",   key:"po",   type:"bin", req:1},
  {id:"c-mm",   key:"mm",   type:"num"},
  {id:"c-ext",  key:"ext",  type:"bin", req:1},
  {id:"c-imp",  key:"imp",  type:"bin"}
];
const SETTINGS = [{lk:"s1", f:0.001},{lk:"s2", f:0.01},{lk:"s3", f:0.05}];
const WMAX = GENES.reduce((a,g)=>a+g.w,0);
const ORDER = [...GENES].sort((a,b)=>b.w-a.w);

/* Pure scoring function — same arithmetic as predict() on the fitted model. */
function score(geno, clin){
  const prs = GENES.reduce((s,g)=> s + (geno[g.id]===1 ? g.w : 0), 0);
  const z = (prs - MU)/SD;
  const eta = MODEL.b0 + MODEL.prs*z + MODEL.bp*(clin.bp===1?1:0) + MODEL.po*(clin.po===1?1:0) + MODEL.ext*(clin.ext===1?1:0);
  return {prs, z, eta, p:1/(1+Math.exp(-eta))};
}
window.__score = score;

/* ---------- state: nothing pre-selected ---------- */
const EMPTY_CLIN = () => ({bmi:null, htn:null, ra:null, ste:null, bp:null, deno:null, bd:null, po:null, mm:null, ext:null, imp:null});
const state = {view:"start", geno:{}, clin:EMPTY_CLIN(), example:false};
GENES.forEach(g=> state.geno[g.id]=null);
const REQ_N = GENES.length + CLIN.filter(c=>c.req).length;
function answered(){ return GENES.filter(g=>state.geno[g.id]!==null).length + CLIN.filter(c=>c.req && state.clin[c.key]!==null).length; }

/* ---------- helpers ---------- */
function rhe(x,d){ const m=Math.pow(10,d), v=x*m, f=Math.floor(v), r=v-f;   // round half to even, as R does
  const n = Math.abs(r-0.5)<1e-9 ? (f%2===0?f:f+1) : Math.round(v); return (n/m).toFixed(d); }
function fmtPct(x){ const v=100*x; return (v>=99.95||v<1 ? v.toFixed(2) : v.toFixed(1))+"%"; }
function applyStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.l===LANG)));
}
function infoHTML(id, label, tip){
  return `<span class="info"><button type="button" class="ib" id="${id}-tip" aria-describedby="${id}-tt" aria-label="${label}: ${t("aInfo")}">i</button><span class="tt" role="tooltip" id="${id}-tt">${tip}</span></span>`;
}

/* ---------- inputs: built once per language; clicks update in place ---------- */
function seg(id, labelId, labels, get, set){
  const w=document.createElement("div"); w.className="seg"; w.setAttribute("role","group"); w.setAttribute("aria-labelledby", labelId); w.id=id+"-seg";
  labels.forEach((txt,i)=>{
    const val = i===0?1:0, b=document.createElement("button");
    b.type="button"; b.id=id+"-"+i; b.textContent=txt; b.dataset.val=val;
    b.addEventListener("click",()=>{ set(val); state.example=false; syncInputs(); });
    w.appendChild(b);
  });
  w._get=get; return w;
}
function buildInputs(){
  const gEl=document.getElementById("genes"); gEl.innerHTML="";
  GENES.forEach(g=>{
    const r=document.createElement("div"); r.className="row"; r.dataset.req="1"; r.dataset.k=g.id;
    r.innerHTML=`<div class="lab"><span class="name" id="${g.id}-lab"><i>${g.gene}</i> <span class="meta">${g.rs}</span></span></div>`;
    r.appendChild(seg(g.id, g.id+"-lab", [t("car"),t("non")], ()=>state.geno[g.id], v=>state.geno[g.id]=v));
    gEl.appendChild(r);
  });
  const cEl=document.getElementById("clin"); cEl.innerHTML="";
  CLIN.forEach(c=>{
    const r=document.createElement("div"); r.className="row"; if(c.req){ r.dataset.req="1"; r.dataset.k=c.key; }
    const label=t("c_"+c.key), tip=T[LANG].tips[c.key];
    const forAttr = c.type==="bin" ? "" : ` for="${c.id}-in"`;
    r.innerHTML=`<div class="lab"><label class="name" id="${c.id}-lab"${forAttr}>${label}</label>${c.req?`<span class="req">${t("req")}</span>`:""}${tip?infoHTML(c.id,label,tip):""}</div>`;
    if (c.type==="bin") {
      r.appendChild(seg(c.id, c.id+"-lab", [t("yes"),t("no")], ()=>state.clin[c.key], v=>{
        state.clin[c.key]=v;
        if (c.key==="po" && v===1) state.clin.bp=1;      // oral bisphosphonate implies bisphosphonate therapy
        if (c.key==="bp" && v===0) state.clin.po=0;
      }));
    } else if (c.type==="bmi") {
      const sel=document.createElement("select"); sel.id=c.id+"-in"; sel.className="inp";
      sel.innerHTML=`<option value="">${t("select")}</option>`+t("bmiL").map((l,i)=>`<option value="${i}">${l}</option>`).join("");
      sel.value = state.clin.bmi===null ? "" : String(state.clin.bmi);
      sel.addEventListener("change",()=>{ state.clin.bmi = sel.value==="" ? null : +sel.value; state.example=false; });
      r.appendChild(sel);
    } else {
      const w=document.createElement("span"); w.className="numw";
      w.innerHTML=`<input class="inp" id="${c.id}-in" type="number" min="0" max="600" step="1" inputmode="numeric"><span class="meta">${t("months")}</span>`;
      const inp=w.querySelector("input"); inp.value = state.clin.mm===null ? "" : state.clin.mm;
      inp.addEventListener("change",()=>{
        if (inp.value===""){ state.clin.mm=null; return; }
        const v=Math.min(600, Math.max(0, Math.round(+inp.value))); state.clin.mm=v; inp.value=v; state.example=false;
      });
      r.appendChild(w);
    }
    cEl.appendChild(r);
  });
  syncInputs();
}
function syncInputs(){   // reflect state without rebuilding (keeps keyboard focus)
  document.querySelectorAll("#panel-in .seg").forEach(w=>{
    const cur=w._get(); w.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(cur===+b.dataset.val)));
  });
  const n=answered(), done=n===REQ_N;
  document.getElementById("progress").textContent = t("prog")(n, REQ_N);
  const go=document.getElementById("go"); go.setAttribute("aria-disabled", String(!done));
  document.querySelectorAll('#panel-in .row[data-req]').forEach(r=>r.classList.remove("missing"));
}
function flagMissing(){
  document.querySelectorAll('#panel-in .row[data-req]').forEach(r=>{
    const k=r.dataset.k, v = k.startsWith("g-") ? state.geno[k] : state.clin[k];
    r.classList.toggle("missing", v===null);
  });
  const first=document.querySelector("#panel-in .row.missing button");
  if (first) { first.focus({preventScroll:true}); first.scrollIntoView({block:"center", behavior:"smooth"}); }
}

/* ---------- result ---------- */
function renderResult(){
  const r=score(state.geno, state.clin), pos = r.p >= 0.5;
  const near = Math.abs(r.p-0.5) < 0.005, dp = near ? 3 : 2;
  const pc=Math.min(1,Math.max(0,r.p));
  const lo={c:.09,h:200}, mid={c:.03,h:80}, hi={c:.14,h:15};          // teal → warm grey at 0.50 → crimson
  const u = pc<0.5 ? pc/0.5 : (pc-0.5)/0.5, A = pc<0.5?lo:mid, B = pc<0.5?mid:hi;
  const res=document.getElementById("panel-out");
  res.style.setProperty("--rh", (A.h+(B.h-A.h)*u).toFixed(1));
  res.style.setProperty("--rc", (A.c+(B.c-A.c)*u).toFixed(3));
  res.style.setProperty("--a", (0.07 + 0.23*Math.abs(pc-0.5)/0.5).toFixed(3));
  document.getElementById("vtag").textContent = pos ? t("vpos") : t("vneg");
  document.getElementById("pnum").textContent = r.p.toFixed(dp);
  const d=Math.abs(r.p-0.5).toFixed(dp);
  document.getElementById("pmargin").textContent = pos ? t("mAbove")(d) : t("mBelow")(d);
  document.getElementById("dot").style.left = (100*pc)+"%";
  document.getElementById("exflag").hidden = !state.example;
  const n = GENES.filter(g=>state.geno[g.id]===1).length;
  document.getElementById("kcount").textContent = n+" / 7";
  document.getElementById("kprs").textContent = r.prs.toFixed(2);
  document.getElementById("kz").textContent = (r.z>=0?"+":"−")+Math.abs(r.z).toFixed(2)+" SD";
  // stacked bar: carried variants first (heaviest first), then the ones not carried
  const stack=document.getElementById("stack"), avgEl=document.getElementById("avg");
  stack.querySelectorAll(".seg7").forEach(e=>e.remove());
  const narrow = window.matchMedia && matchMedia("(max-width:640px)").matches;
  const carried=ORDER.filter(g=>state.geno[g.id]===1), notc=ORDER.filter(g=>state.geno[g.id]!==1);
  [...carried, ...notc].forEach((g,i)=>{
    const on=state.geno[g.id]===1, el=document.createElement("div");
    el.className="seg7"+(on?"":" off"); el.style.width=(100*g.w/WMAX)+"%";
    if (on) el.style.background = (i%2) ? "var(--accent-2)" : "var(--accent)";
    el.textContent = (100*g.w/WMAX) > (narrow ? 13 : 8.5) ? g.gene : "";
    el.title=g.gene+" · "+(on?t("segC"):t("segN"));
    stack.insertBefore(el, avgEl);
  });
  avgEl.style.left=(100*MU/WMAX)+"%";
  document.getElementById("gpsum").textContent = t("gpSum")(n, (100*r.prs/WMAX).toFixed(0));
  const vl=document.getElementById("vlist"); vl.innerHTML="";
  ORDER.forEach((g,i)=>{
    const on=state.geno[g.id]===1, li=document.createElement("li"); li.className=on?"on":"";
    li.innerHTML=`<div class="vh"><span class="g">${g.gene}</span><span class="st">${on?"✓ "+t("car"):t("non")}</span></div>
      <div class="wrow"><div class="wbar"><span style="width:${(100*g.w/ORDER[0].w).toFixed(0)}%"></span></div><span class="wl">${t("rank")(i+1)}</span></div>
      <span class="rs">${g.rs}</span>`;
    vl.appendChild(li);
  });
  // projected performance (independent of the profile)
  const tb=document.getElementById("ptab"); tb.innerHTML="";
  SETTINGS.forEach(s=>{
    const N=1000, cs=N*s.f, nc=N-cs, tp=PERF.se*cs, fn=(1-PERF.se)*cs, tn=PERF.sp*nc, fp=(1-PERF.sp)*nc;
    const posn=Math.round(tp+fp+1e-8);
    tb.insertAdjacentHTML("beforeend",`<tr><td>${t(s.lk)}</td><td class="mono" data-l="${t("th2")}">${posn}</td><td class="mono" data-l="${t("th3")}">${rhe(fn, fn<1?2:1)}</td><td class="mono" data-l="NPV">${fmtPct(tn/(tn+fn))}</td><td class="mono" data-l="PPV">${fmtPct(tp/(tp+fp))}</td></tr>`);
  });
  document.getElementById("sesp").textContent = t("sesp")((100*PERF.se).toFixed(1), (100*PERF.sp).toFixed(1));
}

/* ---------- views ---------- */
function setView(v){
  state.view=v;
  document.querySelector(".wrap").dataset.view = v;
  ["start","in","calc","out"].forEach(k=>{ document.getElementById("panel-"+k).hidden = ({start:"start",input:"in",calc:"calc",result:"out"})[v]!==k; });
  if (v==="result") renderResult();
}
function show(v){
  setView(v);
  try{ window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }catch(e){ window.scrollTo(0,0); }
  if (v==="result") document.getElementById("h-out").focus({preventScroll:true});
  if (v==="input") { const f=document.querySelector("#panel-in .seg button"); if (f) f.focus({preventScroll:true}); }
}
function relabel(){ applyStatic(); buildInputs(); if (state.view==="result") renderResult(); }

let rafId=0, toId=0;
function runCalc(){
  if (answered()!==REQ_N){ flagMissing(); return; }
  cancelAnimationFrame(rafId); clearTimeout(toId);
  show("calc");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DUR = reduce ? 400 : 3800, C = 326.73, t0 = performance.now();
  const fg=document.getElementById("ring-fg"), pct=document.getElementById("pct"),
        st=document.getElementById("cstep"), fill=document.getElementById("cfill");
  const tick = now => {
    const u = Math.min(1,(now-t0)/DUR), e = 1-Math.pow(1-u,2.2), p = Math.round(e*100), steps=t("steps");
    fg.style.strokeDashoffset = (C*(1-e)).toFixed(2);
    fill.style.width = p+"%"; pct.textContent = p+"%";
    st.textContent = steps[Math.min(steps.length-1, Math.floor(e*(steps.length-1) + (u>=1?1:0)))];
    if (u<1) rafId = requestAnimationFrame(tick);
    else toId = setTimeout(()=>show("result"), reduce?0:250);
  };
  rafId = requestAnimationFrame(tick);
}

/* ---------- events ---------- */
document.getElementById("start").addEventListener("click",()=>show("input"));
document.getElementById("go").addEventListener("click",runCalc);
document.getElementById("back").addEventListener("click",()=>show("input"));
document.getElementById("all-car").addEventListener("click",()=>{ GENES.forEach(g=>state.geno[g.id]=1); state.example=false; syncInputs(); });
document.getElementById("all-non").addEventListener("click",()=>{ GENES.forEach(g=>state.geno[g.id]=0); state.example=false; syncInputs(); });
document.getElementById("example").addEventListener("click",()=>{
  GENES.forEach(g=> state.geno[g.id] = ["g-mmrn1","g-cfap"].includes(g.id) ? 0 : 1);
  state.clin = {bmi:1, htn:1, ra:0, ste:0, bp:1, deno:0, bd:0, po:1, mm:36, ext:1, imp:0};
  buildInputs(); state.example=true;
});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  LANG=b.dataset.l; try{ localStorage.setItem("mronj-lang", LANG); }catch(e){} relabel(); }));
document.addEventListener("keydown",e=>{ if (e.key==="Escape" && document.activeElement && document.activeElement.classList.contains("ib")) document.activeElement.blur(); });
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if (state.view==="result") renderResult(); },150); });

applyStatic(); buildInputs(); setView("start");
</script>
